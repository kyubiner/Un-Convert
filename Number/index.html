<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/img/icon.png" type="image/x-icon">

    <title>Number Converter</title>

    <meta name="description"
        content="Universal converter applications such as physical units, number systems, colors and others">
    <meta name="keywords"
        content="unit converter, physical converter, case converter, number converter & color converter">
    <meta name="author" content="Rubikuriku">
    <meta name="theme-color" content="#ffffff">

    <!-- Open Graph SEO -->
    <meta property="og:title" content="Un-Convert">
    <meta property="og:description"
        content="Universal converter applications such as physical units, number systems, colors and others">
    <meta property="og:image" content="https://unit-converter-bice-xi.vercel.app/img/og_img.png">
    <meta property="og:url" content="https://unit-converter-bice-xi.vercel.app/">
    <meta property="og:type" content="website">

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Unit Converter">
    <meta name="twitter:description"
        content="Universal converter applications such as physical units, number systems, colors and others">
    <meta name="twitter:image" content="https://unit-converter-bice-xi.vercel.app/img/og_img.png">

    <link rel="canonical" href="https://unit-converter-bice-xi.vercel.app/">
    <link rel="stylesheet" href="/style/style.css">
</head>
</head>

<body>
    <main class="main-convert">
        <section class="category">
            <h1 class="title">Number Converter</h1>
            <select name="typeConvert" id="type-convert" class="type-convert">
                <option value="binery">Binery</option>
                <option value="data_decimal">Data (decimal)</option>
                <option value="data_binery">Data (binery)</option>
            </select>
        </section>
        <form id="Converter" class="container">
            <section class="category">
                <input type="text" id="input" class="form-design" required />
                <fieldset>
                    <select name="from" id="from-unit">
                        <option value="biner">biner</option>
                        <option value="octal">octal</option>
                        <option value="decimal">decimal</option>
                        <option value="hexadecimal">hexadecimal</option>
                        <option value="text">text</option>
                    </select>
                    <select name="to" id="to-unit">
                        <option value="biner">biner</option>
                        <option value="octal">octal</option>
                        <option value="decimal">decimal</option>
                        <option value="hexadecimal">hexadecimal</option>
                        <option value="text">text</option>
                    </select>
                </fieldset>
                <button id="buttonConvert">Convert</button>
            </section>
            <section class="category">
                <output id="output">Result:
                    <button class="clipboard">
                        <svg fill="#00ccff" width="20px" height="20px" viewBox="0 0 32.00 32.00"
                            xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1"
                            id="list-1" enable-background="new 0 0 32 32" xml:space="preserve">
                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                            <g id="SVGRepo_iconCarrier">
                                <rect x="9" y="14" width="2" height="2"></rect>
                                <rect x="13" y="18" width="10" height="2"></rect>
                                <rect x="9" y="18" width="2" height="2"></rect>
                                <rect x="13" y="22" width="10" height="2"></rect>
                                <rect x="9" y="22" width="2" height="2"></rect>
                                <rect x="13" y="14" width="10" height="2"></rect>
                                <path d="M23 6V4h-6V2h-2v2H9v2H4v24h24V6H23zM11 6h10v2H11V6zM26 28H6V8h3v2h14V8h3V28z">
                                </path>
                            </g>
                        </svg>
                    </button>
                </output>
                <output id="explain"></output>
            </section>
        </form>
    </main>
    <script type="module" src="/script/data.js"></script>
    <script type="module" src="/Number/script.js"></script>
</body>

</html>
